services:
  - type: web
    name: moldova-badminton
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: add a Render Disk mounted at /data, then set DATA_DIR=/data
      # - key: DATA_DIR
      #   value: /data
