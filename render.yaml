services:
  - type: web
    name: moldova-badminton
    runtime: docker
    healthCheckPath: /health
    disk:
      name: mbf-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
